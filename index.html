<style>
/* Layout: one centred column. Path view (units + lesson nodes) swaps with a lesson view. Bare bones on purpose. */
:root {

  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Motion. Snappy = things react at once and land with a tiny overshoot; smooth = nothing ever jumps. */
  --ease-out: cubic-bezier(.22, 1, .36, 1);       /* fast start, soft landing: screens, bars */
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1); /* small overshoot: buttons, pops, the tab pill */
  --ease-in: cubic-bezier(.5, 0, .75, 0);         /* things leaving */
  --t-press: 70ms; --t-fast: 140ms; --t-med: 240ms; --t-slow: 420ms; --t-out: 90ms;
  /* Surfaces. Everything that sits "on top" (cards, tiles, bars, buttons) reads these,

  --elev-1: none; --elev-2: none; --elev-btn: none;
  --r-sm: 8px; --r-md: 10px; --r-lg: 12px; --r-pill: 999px;

<script>
// ---------- helpers ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
const sup = (b, e) => `${b}<sup>${e}</sup>`;
const signed = n => (n < 0 ? `− ${-n}` : `+ ${n}`);
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- content ----------
// Each lesson: idea + example card, then `count` generated practice questions.
// A generator returns { q, a, explain, suffix?, choices? }.
const MAIN_UNITS = [
  { id: 'u1', title: 'Number power-up', desc: 'Powers, roots, scientific notation', lessons: [
    { id: 'u1l1', title: 'What is a power?',
      idea: `A power is repeated multiplication. ${sup(2,3)} means 2 × 2 × 2. The small number is the <b>exponent</b>: it says how many times to multiply.`,
      example: `${sup(5,2)} = 5 × 5 = 25<br>${sup(3,4)} = 3 × 3 × 3 × 3 = 81`,
      gen(lv = 0) { const b = rnd(2, 6 + lv), e = rnd(2, Math.min(b <= 3 ? 5 + lv : 3 + Math.floor(lv / 2), 9)); return { q: `${sup(b,e)} = ?`, a: b ** e, calc: b ** e > 50, explain: `${sup(b,e)} = ${Array(e).fill(b).join(' × ')} = ${b ** e}` }; } },
    { id: 'u1l2', title: 'Multiplying powers',
      idea: `When you multiply powers with the <b>same base</b>, add the exponents: a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>.`,
      example: `${sup(2,3)} × ${sup(2,4)} = (2×2×2) × (2×2×2×2) = ${sup(2,7)}`,
      gen(lv = 0) { const b = pick(['2','3','5','x','a']), m = rnd(2, 9 + 3 * lv), n = rnd(2, 9 + 3 * lv);
        if (lv >= 3) { const r = rnd(2, 9 + 2 * lv); return { q: `${sup(b,m)} × ${sup(b,n)} × ${sup(b,r)} = ${b}<sup>?</sup>`, a: m + n + r, explain: `Add all the exponents: ${m} + ${n} + ${r} = ${m + n + r}` }; }
        return { q: `${sup(b,m)} × ${sup(b,n)} = ${b}<sup>?</sup>`, a: m + n, explain: `Add the exponents: ${m} + ${n} = ${m + n}` }; } },
    { id: 'u1l3', title: 'Dividing powers, power of a power',
      idea: `Dividing powers with the same base: <b>subtract</b> the exponents. a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>.<br>A power of a power: <b>multiply</b> the exponents. (a<sup>m</sup>)<sup>n</sup> = a<sup>m×n</sup>.`,
      example: `${sup(3,8)} ÷ ${sup(3,5)} = ${sup(3,3)}<br>(${sup(2,3)})<sup>4</sup> = ${sup(2,12)}`,
      gen(lv = 0) { const b = pick(['2','3','7','x','y']);
        if (Math.random() < .5) { const n = rnd(2, 6 + 2 * lv), m = n + rnd(1, 7 + 2 * lv); return { q: `${sup(b,m)} ÷ ${sup(b,n)} = ${b}<sup>?</sup>`, a: m - n, explain: `Subtract the exponents: ${m} − ${n} = ${m - n}` }; }
        const m = rnd(2, 6 + lv), n = rnd(2, 5 + lv); return { q: `(${sup(b,m)})<sup>${n}</sup> = ${b}<sup>?</sup>`, a: m * n, explain: `Multiply the exponents: ${m} × ${n} = ${m * n}` }; } },
    { id: 'u1l4', title: 'Square and cube roots',
      idea: `The <b>square root</b> √n is the number that, multiplied by itself, gives n. The <b>cube root</b> ∛n is the number that, used three times, gives n.`,
      example: `√49 = 7, because 7 × 7 = 49<br>∛64 = 4, because 4 × 4 × 4 = 64`,
      gen(lv = 0) { if (Math.random() < .65) { const k = rnd(2, 15 + 4 * lv); return { q: `√${k * k} = ?`, a: k, calc: k > 9, explain: `${k} × ${k} = ${k * k}` }; }
        const k = rnd(2, 6 + lv); return { q: `∛${k ** 3} = ?`, a: k, calc: k > 3, explain: `${k} × ${k} × ${k} = ${k ** 3}` }; } },
    { id: 'u1l5', title: 'Scientific notation',
      idea: `Big numbers can be written as a number between 1 and 10, times a power of 10. 10<sup>4</sup> = 10 000, so 3.2 × 10<sup>4</sup> = 32 000.`,
      example: `5.7 × 10<sup>3</sup> = 5 700<br>45 000 = 4.5 × 10<sup>4</sup> (move the decimal point 4 places)`,
      gen(lv = 0) { const m = lv >= 2 ? rnd(101, 999) / 100 : rnd(11, 99) / 10, e = rnd(2, Math.min(6 + lv, 9)), v = Math.round(m * 10 ** e);
        if (Math.random() < .5) return { q: `Write ${m} × 10<sup>${e}</sup> as a normal number.`, a: v, explain: `Move the decimal point ${e} places right: ${v.toLocaleString('en-IE')}` };
        return { q: `${v.toLocaleString('en-IE')} = ${m} × 10<sup>?</sup>`, a: e, explain: `The decimal point moves ${e} places, so the exponent is ${e}.` }; } },
  ]},
  { id: 'u2', title: 'Algebra workshop', desc: 'Like terms, brackets, factoring, formulas', lessons: [
    { id: 'u2l1', title: 'Collecting like terms',
      idea: `Terms with the same letter are "like terms" and can be added or subtracted: 3x + 5x = 8x. You can't combine x and y, or x and a plain number.`,
      example: `7a − 2a = 5a<br>4x + 3 + 2x = 6x + 3`,
      gen(lv = 0) { const v = pick(['x','a','y']), a = rnd(2, 12 + 5 * lv), b = rnd(1, 9 + 5 * lv), plus = Math.random() < .6;
        return { q: `${a}${v} ${plus ? '+' : '−'} ${co(b)}${v} = ?${v}`, a: plus ? a + b : a - b, suffix: v, explain: `${a} ${plus ? '+' : '−'} ${b} = ${plus ? a + b : a - b}` }; } },
    { id: 'u2l2', title: 'Expanding brackets',
      idea: `The number outside the bracket multiplies <b>everything</b> inside: a(b + c) = ab + ac.`,
      example: `3(x + 4) = 3x + 12<br>5(x − 2) = 5x − 10`,
      gen(lv = 0) { const a = rnd(2, 9 + 2 * lv), b = rnd(1, 9 + 3 * lv), minus = Math.random() < .4;
        return { q: `${a}(x ${minus ? '−' : '+'} ${b}) = ${a}x ${minus ? '−' : '+'} ?`, a: a * b, explain: `${a} × ${b} = ${a * b}` }; } },
    { id: 'u2l3', title: 'Factoring out',
      idea: `Factoring is expanding backwards: find a number that divides every term and take it outside a bracket.`,
      example: `12x + 8 = 4(3x + 2), because 4 × 3x = 12x and 4 × 2 = 8`,
      gen(lv = 0) { const g = rnd(2, 6 + lv), p = rnd(2, 7 + lv), q = rnd(1, 9 + 2 * lv);
        return { q: `${g * p}x + ${g * q} = ${g}(${p}x + ?)`, a: q, explain: `${g} × ? = ${g * q}, so ? = ${q}` }; } },
    { id: 'u2l4', title: 'Rearranging formulas',
      idea: `To get a letter on its own, undo what is being done to it, doing the same thing to both sides.`,
      example: `A = l × w. Divide both sides by l: w = A ÷ l`,
      gen(lv = 0) { return pick([
        { q: 'A = l × w. Which is right?', choices: ['w = A ÷ l', 'w = A × l', 'w = A − l', 'w = l ÷ A'], a: 'w = A ÷ l', explain: 'Divide both sides by l.' },
        { q: 'P = 4s. Which is right?', choices: ['s = P ÷ 4', 's = 4P', 's = P − 4', 's = 4 ÷ P'], a: 's = P ÷ 4', explain: 'Divide both sides by 4.' },

const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const frac = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
// Simplest form as a string the answer checker understands: "3/4", "-1/2" or "2".
function fracStr(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n) : `${n}/${d}`; }
const fracHtml = (n, d) => { const t = fracStr(n, d); if (!t.includes('/')) return t; const [a, b] = t.split('/'); return a.startsWith('-') ? `−${frac(a.slice(1), b)}` : frac(a, b); };
const neg = n => (n < 0 ? `(−${-n})` : String(n));
const factorsOf = n => { const f = []; for (let i = 1; i <= n; i++) if (n % i === 0) f.push(i); return f; };
const isPrime = n => n > 1 && factorsOf(n).length === 2;
const dec = n => Number(n.toFixed(6)); // tidy decimals: 0.1 + 0.2 → 0.3
// Round to p decimal places the way people do (4.185 → 4.19). Plain Math.round(v * 100) gets this wrong because 4.185 is stored as 4.18499…
const roundTo = (v, p) => Number(Math.round(Number(dec(v) + 'e' + p)) + 'e-' + p);
const listJoin = arr => arr.length < 3 ? arr.join(' and ') : `${arr.slice(0, -1).join(', ')} and ${arr[arr.length - 1]}`;
const euro = n => `€${Number(n).toFixed(2)}`;
const supU = (v, e) => v + String(e).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join(''); // x⁵ as plain text (for multiple choice)

      example: `6.473 to 2 decimal places → 6.47<br>6.473 to 1 decimal place → 6.5<br>6.473 to the nearest whole number → 6`,
      gen(lv = 0) { const v = rnd(1001, 99999 + 50000 * lv) / 1000, p = pick([0, 1, 2]);
        return { q: `Round ${v} to ${p ? `${p} decimal place${p > 1 ? 's' : ''}` : 'the nearest whole number'}.`, a: roundTo(v, p), explain: `Look at the digit after the ${p ? `${p === 1 ? 'first' : 'second'} decimal place` : 'units'}.` }; } },
    { id: 'b6l4', title: 'Probability and decimals',
      idea: `Probabilities can be decimals between 0 and 1. The probability something does <b>not</b> happen is 1 − the probability it does. Expected number = probability × number of tries.`,
      example: `P(rain) = 0.3, so P(no rain) = 1 − 0.3 = 0.7<br>P(red) = 0.25, spin 40 times → expect 0.25 × 40 = 10 reds`,
      gen(lv = 0) { const p = rnd(1, 19) * 5 / 100;
        if (Math.random() < .5) return { q: `The probability of winning a game is ${p}. What is the probability of not winning?`, a: dec(1 - p), explain: `1 − ${p} = ${dec(1 - p)}` };
        const n = pick([20, 40, 60, 100, 200]) * (lv >= 2 ? 3 : 1); return { q: `P(red) = ${p} on a spinner. You spin it ${n} times. How many reds do you expect?`, a: dec(p * n), calc: true, explain: `${p} × ${n} = ${dec(p * n)}` }; } },
  ]},
  { id: 'b7', stage: 'book', title: 'Sets', desc: 'Book chapter 6', lessons: [
    { id: 'b7l1', title: 'Describing a set',
      idea: `A <b>set</b> is a collection of things, written in curly brackets. Each thing is an <b>element</b> (∈ means "is an element of"). #A is how many elements A has. Two sets are <b>equal</b> if they have exactly the same elements, in any order.`,
      example: `A = {2, 4, 6, 8}: 4 ∈ A, 5 ∉ A, #A = 4<br>{1, 2, 3} = {3, 1, 2}`,
      gen(lv = 0) { const A = shuffle(Array.from({ length: 12 + 4 * lv }, (_, i) => i + 1)).slice(0, rnd(3, 6 + lv)).sort((a, b) => a - b), s = `A = {${A.join(', ')}}`;
        const t = rnd(0, 3);
        if (t === 0) return { q: `${s}. What is #A?`, a: A.length, explain: `Count the elements: ${A.length}.` };
        if (t === 1) { const x = rnd(1, 12 + 4 * lv); return { q: `${s}. Is ${x} ∈ A?`, choices: ['Yes', 'No'], a: A.includes(x) ? 'Yes' : 'No', explain: A.includes(x) ? `${x} is in the list.` : `${x} is not in the list.` }; }
        if (t === 2) { const n = rnd(10, 20 + 10 * lv), k = pick([2, 3, 5]); const c = Math.floor(n / k); return { q: `B = {multiples of ${k} from 1 to ${n}}. What is #B?`, a: c, explain: `${Array.from({ length: c }, (_, i) => (i + 1) * k).join(', ')}: that's ${c}.` }; }
        const same = Math.random() < .5, B = same ? shuffle(A) : shuffle(A.map((v, i) => { if (i) return v; let w = v + 1; while (A.includes(w)) w++; return w; }));
        return { q: `${s} and B = {${B.join(', ')}}. Are A and B equal?`, choices: ['Yes', 'No'], a: same ? 'Yes' : 'No', explain: same ? `Same elements, just in a different order.` : `They don't have exactly the same elements.` }; } },
    { id: 'b7l2', title: 'Union and intersection',
      idea: `<b>A ∩ B</b> (intersection) is what is in <b>both</b> sets. <b>A ∪ B</b> (union) is everything in <b>either</b> set, written once. A Venn diagram shows them as overlapping circles.`,
      example: `A = {1, 2, 3, 4}, B = {3, 4, 5}<br>A ∩ B = {3, 4}, A ∪ B = {1, 2, 3, 4, 5}`,
      gen(lv = 0) { const pool = shuffle(Array.from({ length: 15 + 5 * lv }, (_, i) => i + 1)), nb = rnd(1, 3 + lv), na = rnd(1, 3), nc = rnd(1, 3);
        const both = pool.slice(0, nb), A = [...both, ...pool.slice(nb, nb + na)].sort((a, b) => a - b), B = [...both, ...pool.slice(nb + na, nb + na + nc)].sort((a, b) => a - b);
        const s = `A = {${A.join(', ')}}, B = {${B.join(', ')}}.`;
        if (Math.random() < .5) return { q: `${s} What is #(A ∩ B)?`, a: nb, explain: `In both: {${both.sort((a, b) => a - b).join(', ')}}` };
        return { q: `${s} What is #(A ∪ B)?`, a: na + nb + nc, explain: `Everything, written once: ${A.length} + ${B.length} − ${nb} = ${na + nb + nc}` }; } },
    { id: 'b7l3', title: 'Universal set and complement',
      idea: `The <b>universal set</b> U holds everything we're talking about. The <b>complement</b> A′ is everything in U that is <b>not</b> in A, so #A′ = #U − #A.`,
      example: `U = {1, 2, 3, 4, 5, 6}, A = {2, 4}<br>A′ = {1, 3, 5, 6}, #A′ = 4`,
      gen(lv = 0) { if (Math.random() < .5) { const n = rnd(8, 12 + 4 * lv), A = shuffle(Array.from({ length: n }, (_, i) => i + 1)).slice(0, rnd(2, n - 2)).sort((a, b) => a - b);
          return { q: `U = {1, 2, …, ${n}} and A = {${A.join(', ')}}. What is #A′?`, a: n - A.length, explain: `${n} − ${A.length} = ${n - A.length}` }; }
        const both = rnd(2, 8 + lv), a = rnd(2, 10 + 3 * lv), b = rnd(2, 10 + 3 * lv), out = rnd(1, 6 + lv), U = a + b + both + out;
        return { q: `In a class of ${U}, ${a + both} play football, ${b + both} play hurling and ${both} play both. How many play neither?`, a: out, calc: lv >= 2, explain: `Football or hurling: ${a + both} + ${b + both} − ${both} = ${a + b + both}. Neither: ${U} − ${a + b + both} = ${out}` }; } },
  ]},
  { id: 'b8', stage: 'book', title: 'Percentages', desc: 'Book chapter 7', lessons: [
    { id: 'b8l1', title: 'Percentages, fractions and decimals',
      idea: `Per cent means "out of 100". To change a percentage to a decimal, divide by 100. To a fraction, put it over 100 and simplify. To change a decimal to a percentage, multiply by 100.`,
      example: `35% = 0.35 = ${frac(35, 100)} = ${frac(7, 20)}<br>0.6 = 60%, ${frac(3, 4)} = 75%`,
      gen(lv = 0) { const p = pick([5, 10, 12, 15, 20, 25, 30, 35, 40, 45, 50, 60, 64, 70, 75, 80, 85, 90, 95, ...(lv >= 2 ? [2.5, 12.5, 120, 150] : [])]), t = rnd(0, 3);
        if (t === 0) return { q: `Write ${p}% as a decimal.`, a: dec(p / 100), explain: `${p} ÷ 100 = ${dec(p / 100)}` };
        if (t === 1 && Number.isInteger(p)) return { q: `Write ${p}% as a fraction in its simplest form.`, a: fracStr(p, 100), simplest: true, explain: `${frac(p, 100)} = ${fracHtml(p, 100)}` };
        if (t === 2) return { q: `Write ${dec(p / 100)} as a percentage.`, a: p, suffix: '%', explain: `${dec(p / 100)} × 100 = ${p}%` };
        const [n, d] = pick([[1, 2], [1, 4], [3, 4], [1, 5], [2, 5], [3, 5], [4, 5], [1, 10], [3, 10], [7, 10], [1, 20], [3, 20], [1, 25], [7, 25], [1, 8]]);
        return { q: `Write ${frac(n, d)} as a percentage.`, a: dec(n / d * 100), suffix: '%', explain: `${n} ÷ ${d} × 100 = ${dec(n / d * 100)}%` }; } },
    { id: 'b8l2', title: 'Working with percentages',
      idea: `To find a percentage of an amount, change it to a decimal and multiply. To write one number as a percentage of another, divide and multiply by 100.`,
      example: `15% of 80 = 0.15 × 80 = 12<br>12 out of 48 = 12 ÷ 48 × 100 = 25%`,
      gen(lv = 0) { if (Math.random() < .5) { const p = pick([5, 10, 15, 20, 25, 30, 40, 50, 60, 75, ...(lv >= 2 ? [12, 17.5, 35, 65] : [])]), n = rnd(1, 20 + 10 * lv) * 20;
          return { q: `What is ${p}% of ${n}?`, a: dec(p / 100 * n), calc: lv >= 1, explain: `${dec(p / 100)} × ${n} = ${dec(p / 100 * n)}` }; }
        const p = pick([10, 20, 25, 40, 50, 60, 75, 80]), whole = rnd(1, 10 + 5 * lv) * 20, part = whole * p / 100;
        return { q: `You got ${part} out of ${whole} in a test. What percentage is that?`, a: p, suffix: '%', calc: lv >= 1, explain: `${part} ÷ ${whole} × 100 = ${p}%` }; } },
    { id: 'b8l3', title: 'VAT and discount',
      idea: `<b>VAT</b> is a tax added on to a price. <b>Discount</b> is money taken off. Work out the percentage, then add it (VAT) or take it away (discount).`,
      example: `€80 + 23% VAT: 0.23 × 80 = €18.40, so €98.40<br>€60 with 15% off: 0.15 × 60 = €9, so €51`,
      gen(lv = 0) { const vat = Math.random() < .5, p = vat ? pick([10, 13.5, 20, 23]) : pick([10, 15, 20, 25, 30, 40, 50]), n = rnd(2, 30 + 20 * lv) * 10;
        const ch = dec(p / 100 * n), tot = dec(vat ? n + ch : n - ch);
        return { q: vat ? `A bike costs €${n} before VAT. VAT is ${p}%. What is the price with VAT?` : `A jacket costs €${n}. It has a ${p}% discount. What is the sale price?`, a: tot, calc: true, explain: `${p}% of €${n} = ${euro(ch)}, so €${n} ${vat ? '+' : '−'} ${euro(ch)} = ${euro(tot)}` }; } },
    { id: 'b8l4', title: 'Percentage profit and loss',
      idea: `Profit = selling price − cost price. Percentage profit = profit ÷ <b>cost price</b> × 100. Loss works the same way.`,
      example: `Bought for €40, sold for €50: profit €10, 10 ÷ 40 × 100 = 25% profit`,
      gen(lv = 0) { const p = pick([5, 10, 15, 20, 25, 30, 40, 50, 60]), cost = rnd(1, 15 + 10 * lv) * 20, profit = Math.random() < .65, ch = cost * p / 100, sell = profit ? cost + ch : cost - ch;
        return { q: `A shop buys a game for €${cost} and sells it for €${sell}. What is the percentage ${profit ? 'profit' : 'loss'}?`, a: p, suffix: '%', calc: true, explain: `${profit ? 'Profit' : 'Loss'} = €${ch}. ${ch} ÷ ${cost} × 100 = ${p}%` }; } },
  ]},
  { id: 'b9', stage: 'book', title: 'Algebra basics', desc: 'Book chapter 8', lessons: [
    { id: 'b9l1', title: 'Using letters',
      idea: `A letter stands for a number we don't know yet. 3x means 3 × x, x + 3 means "3 more than x", and x − 3 means "3 less than x".`,
      example: `"5 more than n" → n + 5<br>"double y" → 2y<br>"x shared between 4" → x ÷ 4`,
      gen(lv = 0) { const v = pick(['x', 'n', 'y']), k = rnd(2, 9 + lv);
        const opts = [[`${k} more than ${v}`, `${v} + ${k}`], [`${k} less than ${v}`, `${v} − ${k}`], [`${v} multiplied by ${k}`, `${k}${v}`], [`${v} taken away from ${k}`, `${k} − ${v}`], [`${v} divided by ${k}`, `${v} ÷ ${k}`], [`${v} squared`, `${v}²`]];
        const [words, ans] = pick(opts), choices = shuffle(opts.map(o => o[1]).filter(c => c !== ans)).slice(0, 3).concat(ans);
        return { q: `Which means "${words}"?`, choices, a: ans, explain: `"${words}" is ${ans}` }; } },
    { id: 'b9l2', title: 'Substituting numbers for letters',
      idea: `<b>Substitute</b> means put the number in place of the letter, then work it out. Use brackets around negative numbers, and remember BIMDAS.`,
      example: `If x = 3 and y = −2: 4x + y = 4(3) + (−2) = 12 − 2 = 10`,
      gen(lv = 0) { const x = rnd(lv >= 1 ? -6 : 1, 6 + lv), y = rnd(lv >= 1 ? -6 : 1, 6 + lv), a = rnd(2, 6), b = rnd(2, 6);
        const opts = [
          [`${a}x + ${b}y`, a * x + b * y, `${a}(${x}) + ${b}(${y}) = ${a * x} + ${neg(b * y)}`],
          [`${a}x − y`, a * x - y, `${a * x} − ${neg(y)}`],
          [`${sup('x', 2)} + ${b}`, x * x + b, `${neg(x)}² = ${x * x}, + ${b}`],
          [`xy + ${a}`, x * y + a, `${neg(x)} × ${neg(y)} = ${x * y}, + ${a}`],
        ];
        const [e, val, how] = pick(lv >= 1 ? opts : opts.slice(0, 2).concat([opts[3]]));
        return { q: `If x = ${x} and y = ${y}, find the value of ${e}.`, a: val, explain: `${how} = ${val}` }; } },
    { id: 'b9l3', title: 'Removing brackets',
      idea: `Multiply everything inside the bracket by the number outside. A minus outside changes the sign of everything inside. Then collect like terms.`,
      example: `−2(x − 3) = −2x + 6<br>3(x + 2) + 2(x + 1) = 3x + 6 + 2x + 2 = 5x + 8`,
      gen(lv = 0) { const a = rnd(2, 6 + lv), b = rnd(1, 9), c = rnd(2, 5 + lv), d = rnd(1, 9);
        if (Math.random() < .5) return { q: `−${a}(x − ${b}) = −${a}x + ?`, a: a * b, explain: `−${a} × −${b} = +${a * b}` };
        return { q: `${a}(x + ${b}) + ${c}(x + ${d}) = ?x + ${a * b + c * d}`, a: a + c, suffix: 'x', explain: `${a}x + ${a * b} + ${c}x + ${c * d} = ${a + c}x + ${a * b + c * d}` }; } },
    { id: 'b9l4', title: 'Multiplying with indices',
      idea: `When you multiply the same letter, <b>add</b> the powers: x² × x³ = x⁵. Multiply the numbers in front as normal.`,
      example: `${sup('x', 2)} × ${sup('x', 4)} = ${sup('x', 6)}<br>3x × 4x = 12${sup('x', 2)}<br>2${sup('a', 3)} × 5a = 10${sup('a', 4)}`,
      gen(lv = 0) { const v = pick(['x', 'a', 'y']), m = rnd(1, 4 + lv), n = rnd(1, 4 + lv), p = rnd(1, 5 + lv), q = rnd(1, 5 + lv);
        const t = (c, e) => `${c === 1 ? '' : c}${e === 1 ? v : supU(v, e)}`, ans = t(p * q, m + n);
        const choices = shuffle([t(p * q, m * n), t(p + q, m + n), t(p * q, m + n + 1), t(p + q, m * n), t(p * q + 1, m + n), t(p * q, m + n + 2)].filter((c, i, arr) => c !== ans && arr.indexOf(c) === i)).slice(0, 3).concat(ans);
        return { q: `${t(p, m)} × ${t(q, n)} = ?`, choices, a: ans, explain: `Numbers: ${p} × ${q} = ${p * q}. Powers: ${m} + ${n} = ${m + n}.` }; } },
    { id: 'b9l5', title: 'Multiplying two brackets',
      idea: `Multiply each term in the first bracket by each term in the second (4 multiplications), then collect like terms.`,
      example: `(x + 2)(x + 3) = ${sup('x', 2)} + 3x + 2x + 6 = ${sup('x', 2)} + 5x + 6`,
      gen(lv = 0) { const a = rnd(lv >= 2 ? -6 : 1, 6 + lv) || 1, b = rnd(lv >= 2 ? -6 : 1, 6 + lv) || 2, s = n => (n < 0 ? `− ${-n}` : `+ ${n}`);
        const br = `(x ${s(a)})(x ${s(b)})`;
        const xt = a + b === 0 ? '' : ` ${a + b < 0 ? '−' : '+'} ${co(Math.abs(a + b))}x`;
        if (a + b !== 0 && Math.random() < .5) return { q: `${br} = ${sup('x', 2)} + ?x ${s(a * b)}`, a: a + b, explain: `The x terms: ${a}x + ${neg(b)}x = ${a + b}x` };
        return { q: `${br} = ${sup('x', 2)}${xt} + ?`, a: a * b, explain: `The number term: ${neg(a)} × ${neg(b)} = ${a * b}` }; } },
  ]},
  { id: 'b10', stage: 'book', title: 'Area, perimeter and volume', desc: 'Book chapter 9', lessons: [
    { id: 'b10l1', title: 'Metric system',
      idea: `10 mm = 1 cm, 100 cm = 1 m, 1000 m = 1 km. 1000 g = 1 kg, 1000 ml = 1 litre. Going to a smaller unit: multiply. Going to a bigger unit: divide.`,
      example: `3.5 m = 350 cm<br>2400 g = 2.4 kg`,
      gen(lv = 0) { const [big, small, k] = pick([['cm', 'mm', 10], ['m', 'cm', 100], ['km', 'm', 1000], ['kg', 'g', 1000], ['litres', 'ml', 1000]]);
        if (Math.random() < .5) { const v = rnd(1, 50 + 50 * lv) / pick([1, 10]); return { q: `${v} ${v === 1 && big === 'litres' ? 'litre' : big} = ? ${small}`, a: dec(v * k), suffix: small, explain: `Smaller unit, so multiply by ${k}: ${dec(v * k)}` }; }
        const v = rnd(1, 99 + 900 * lv) * (k / pick([1, 10])); return { q: `${dec(v)} ${small} = ? ${big === 'litres' ? 'litre(s)' : big}`, a: dec(v / k), suffix: big, explain: `Bigger unit, so divide by ${k}: ${dec(v / k)}` }; } },
    { id: 'b10l2', title: 'Perimeter',
      idea: `The <b>perimeter</b> is the distance all the way around the outside of a shape. Add up all the sides.`,
      example: `Rectangle 8 cm by 5 cm: 8 + 5 + 8 + 5 = 26 cm`,
      gen(lv = 0) { const l = rnd(3, 15 + 5 * lv), w = rnd(2, 12 + 5 * lv), t = rnd(0, 2);
        if (t === 0) return { q: `A rectangle is ${l} cm long and ${w} cm wide. What is its perimeter?`, a: 2 * (l + w), suffix: 'cm', explain: `${l} + ${w} + ${l} + ${w} = ${2 * (l + w)}` };
        if (t === 1) return { q: `A square has a perimeter of ${4 * l} cm. How long is each side?`, a: l, suffix: 'cm', explain: `${4 * l} ÷ 4 = ${l}` };
        const c = rnd(Math.abs(l - w) + 1, l + w - 1); return { q: `A triangle has sides ${l} cm, ${w} cm and ${c} cm. What is its perimeter?`, a: l + w + c, suffix: 'cm', explain: `${l} + ${w} + ${c} = ${l + w + c}` }; } },
    { id: 'b10l3', title: 'Area of rectangles and triangles',
      idea: `Area of a rectangle = length × width. A triangle is half a rectangle, so area of a triangle = ½ × base × perpendicular height. Area is in square units (cm²).`,
      example: `Rectangle 6 cm × 4 cm = 24 cm²<br>Triangle, base 6 cm, height 4 cm = ½ × 6 × 4 = 12 cm²`,
      gen(lv = 0) { const l = rnd(2, 12 + 5 * lv), w = rnd(2, 12 + 5 * lv), t = rnd(0, 2), big = l * w > 80;
        if (t === 0) return { q: `What is the area of a rectangle ${l} cm by ${w} cm?`, a: l * w, suffix: 'cm²', calc: big, explain: `${l} × ${w} = ${l * w}` };
        if (t === 1) { const b = 2 * Math.ceil(l / 2); return { q: `A triangle has base ${b} cm and perpendicular height ${w} cm. What is its area?`, a: b * w / 2, suffix: 'cm²', calc: big, explain: `½ × ${b} × ${w} = ${b * w / 2}` }; }
        return { q: `A rectangle has an area of ${l * w} cm² and a length of ${l} cm. What is its width?`, a: w, suffix: 'cm', calc: big, explain: `${l * w} ÷ ${l} = ${w}` }; } },
    { id: 'b10l4', title: 'Rectangular solids',
      idea: `A rectangular solid (cuboid) has 6 rectangle faces. <b>Volume</b> = length × width × height (cm³). <b>Surface area</b> = the area of all 6 faces added up.`,
      example: `A box 5 × 3 × 2 cm: volume = 30 cm³<br>Surface area = 2(5×3) + 2(5×2) + 2(3×2) = 30 + 20 + 12 = 62 cm²`,
      gen(lv = 0) { const l = rnd(2, 8 + 3 * lv), w = rnd(2, 6 + 2 * lv), h = rnd(1, 6 + 2 * lv), t = rnd(0, lv >= 1 ? 2 : 1);
        if (t === 0) return { q: `A box is ${l} cm long, ${w} cm wide and ${h} cm high. What is its volume?`, a: l * w * h, suffix: 'cm³', calc: true, explain: `${l} × ${w} × ${h} = ${l * w * h}` };
        if (t === 1) return { q: `A cube has sides of ${w} cm. What is its volume?`, a: w ** 3, suffix: 'cm³', calc: true, explain: `${w} × ${w} × ${w} = ${w ** 3}` };
        const sa = 2 * (l * w + l * h + w * h); return { q: `A box is ${l} cm × ${w} cm × ${h} cm. What is its total surface area?`, a: sa, suffix: 'cm²', calc: true, explain: `2(${l * w}) + 2(${l * h}) + 2(${w * h}) = ${sa}` }; } },
    { id: 'b10l5', title: 'Nets of solids',
      idea: `A <b>net</b> is a flat shape you can fold up to make a solid. Count the faces of the solid: a cube has 6 squares, a triangular prism has 2 triangles and 3 rectangles.`,
      example: `Cube: 6 faces, 12 edges, 8 corners (vertices)<br>Square-based pyramid: 5 faces, 8 edges, 5 vertices`,
      gen(lv = 0) { const S = [['a cube', 6, 12, 8, '6 squares'], ['a cuboid', 6, 12, 8, '6 rectangles'], ['a triangular prism', 5, 9, 6, '2 triangles and 3 rectangles'], ['a square-based pyramid', 5, 8, 5, '1 square and 4 triangles'], ['a triangular pyramid (tetrahedron)', 4, 6, 4, '4 triangles']];
        const s = pick(S);
        if (Math.random() < .4) { const choices = shuffle(S.filter(o => o !== s)).slice(0, 3).map(o => o[0]).concat(s[0]); return { q: `A net is made of ${s[4]}. What solid does it fold into?`, choices, a: s[0], explain: `${s[4]} fold into ${s[0]}.` }; }
        const [what, i] = pick([['faces', 1], ['edges', 2], ['vertices (corners)', 3]]);
        return { q: `How many ${what} does ${s[0]} have?`, a: s[i], explain: `${s[0][0].toUpperCase() + s[0].slice(1)}: ${s[1]} faces, ${s[2]} edges, ${s[3]} vertices.` }; } },
  ]},
  { id: 'b11', stage: 'book', title: 'Geometry 1', desc: 'Book chapter 10: angles and parallel lines', lessons: [
    { id: 'b11l1', title: 'Types of angles',
      idea: `<b>Acute</b>: less than 90°. <b>Right</b>: exactly 90°. <b>Obtuse</b>: between 90° and 180°. <b>Straight</b>: 180°. <b>Reflex</b>: more than 180°.`,
      example: `40° is acute, 90° is right, 130° is obtuse, 250° is reflex`,
      gen(lv = 0) { const kind = pick(['Acute', 'Right', 'Obtuse', 'Straight', 'Reflex', 'Acute', 'Obtuse', 'Reflex']);
        const a = { Acute: rnd(5, 89), Right: 90, Obtuse: rnd(91, 179), Straight: 180, Reflex: rnd(181, 355) }[kind];
        return { q: `What type of angle is ${a}°?`, choices: ['Acute', 'Right', 'Obtuse', 'Straight', 'Reflex'], a: kind, explain: `${a}° is ${kind.toLowerCase()}.` }; } },
    { id: 'b11l2', title: 'Calculating angles',
      idea: `Angles on a straight line add up to <b>180°</b>. Angles around a point add up to <b>360°</b>. <b>Vertically opposite</b> angles (where two lines cross) are equal.`,
      example: `Straight line: 180 − 65 = 115°<br>Around a point: 360 − 100 − 140 = 120°`,

      hint.classList.add('closing');
      hint.addEventListener('animationend', () => { if (hint.classList.contains('closing')) { hint.classList.remove('closing'); hint.hidden = true; } }, { once: true });
    };
    const notes = document.getElementById('notes');
    notes.value = run.notes;
    notes.oninput = () => { run.notes = notes.value; };
    notes.addEventListener('keydown', e => { if (e.key === 'Enter') e.stopPropagation(); });
    document.getElementById('notesClear').onclick = () => { notes.value = ''; run.notes = ''; };
  }
  const input = document.getElementById('ans'); if (input) input.focus();

  go.onclick = () => {
    if (!c.item) return next();
    if (checked) return next();
    const given = c.item.choices ? selected : input.value;
    if (!devMode && (given == null || String(given).trim() === '')) return;
    checked = true; if (input) input.disabled = true;
    const ok = devMode || isRight(c.item, given), fb = document.getElementById('fb');
    run.answered = (run.answered || 0) + 1;
    if (!ok && !c.retry) run.misses++;
    noteResult(c, ok);
    if (run.daily) { state.daily[today()] = ok; save(); }
    beep(ok);
    replay(app.querySelector('.play .card'), ok ? 'is-good' : 'is-bad');
    if (ok) { run.correct++; fb.className = 'fb good'; fb.innerHTML = '✓ Correct!'; }
    else {
      fb.className = 'fb bad';
      fb.innerHTML = `✗ ${notSimplest(c.item, given) ? 'That\'s equal, but not in its simplest form.' : 'Not quite.'} The answer is <b>${String(c.item.a).includes('/') && !/[a-z]/i.test(c.item.a) ? fracHtml(...String(c.item.a).split('/').map(Number)) : c.item.a}</b>.<br>${c.item.explain}`;
      // Duolingo style: a missed practice question comes back at the end (not in tests).
      if (!run.isTest && !run.practice && !run.review && !run.daily) run.cards.push({ kind: 'Try again', lid: c.lid, item: c.item, retry: true });
    }
    go.textContent = 'Continue'; replay(go, 'ready');
  };
}
// ---------- calculator (only on harder questions) ----------
function calcHTML() {
  const keys = ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','^','+','(',')','√','=','C','⌫'];
  return `<div class="calc" aria-label="Calculator"><b>Calculator</b>
    <input type="text" id="calcIn" autocomplete="off" aria-label="Calculator input" placeholder="e.g. 3^4 or √144">
    <div class="res" id="calcOut"></div>
    <div class="keys">${keys.map(k => `<button data-k="${k}">${k}</button>`).join('')}</div></div>`;
}
function calcEval(expr) {
  let e = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\^/g, '**').replace(/\s+/g, '');
  if (!/^[0-9+\-*/().√]*$/.test(e) || e === '') return '';
  e = e.replace(/√(\d+(\.\d+)?)/g, 'Math.sqrt($1)').replace(/√\(/g, 'Math.sqrt(');
  e = e.replace(/(^|[(*\/+\-])-(\d+(?:\.\d+)?)(?=\*\*)/g, '$1(-1)*$2'); // −3^2 means −(3^2), like on a real calculator
  if (e.includes('√')) return 'Error';
  try { const v = Function('"use strict";return (' + e + ')')(); return Number.isFinite(v) ? String(Math.round(v * 1e9) / 1e9) : 'Error'; }
  catch (err) { return 'Error'; }
}
function wireCalc() {
  const inp = document.getElementById('calcIn'), out = document.getElementById('calcOut');
  const run = () => { out.textContent = inp.value ? '= ' + calcEval(inp.value) : ''; };
  app.querySelectorAll('.calc [data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'C') { inp.value = ''; out.textContent = ''; }
    else if (k === '⌫') inp.value = inp.value.slice(0, -1);
    else if (k === '=') run();
    else inp.value += k;
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); e.preventDefault(); run(); } });
}

function next() { if (run.practice) addPracticeCard(); run.i++; run.i >= run.cards.length ? swap('zoom', finish) : swap('next', renderCard); }

function finish() {
  if (run.practice) { run.xp = run.correct; state.bestLevel = Math.max(state.bestLevel, practiceLevel() + 1); } // 1 XP per right answer
  if (run.review) run.xp = run.correct * 2;
  if (run.daily) { run.xp = run.correct ? XP_DAILY : 0; state.daily[today()] = run.correct > 0; }
  const passed = !run.isTest || run.correct >= TEST_PASS;
  const streakBefore = shownStreak();
  if (passed) {
    if (run.testOut) run.unit.lessons.forEach(l => state.done[l.id] = true);
    finishItem(run.id, run.xp);
  } else save();
  renderStats();
  const answered = run.practice || run.review || run.daily ? run.answered || 0 : run.total;
  const right = run.practice || run.isTest || run.review || run.daily ? run.correct : run.total - run.misses;
  const acc = answered ? Math.round(right / answered * 100) : 0;
  const [icon, head, sub] = run.daily ? (run.correct ? ['⭐', 'Challenge beaten!', 'Come back tomorrow for a new one.'] : ['🌙', 'Not this time', "It's been added to your review pile. New challenge tomorrow."])
    : run.review ? ['📝', 'Review done', Object.keys(state.review).length ? 'Topics you got right come back later, spaced out, until they stick.' : 'Your review pile is empty!']
    : run.isTest ? (passed ? ['🏆', run.testOut ? 'Tested out!' : 'Unit passed!', run.testOut ? `You skipped "${run.unit.title}". All its notes are unlocked.` : 'Next unit unlocked.'] : ['💪', 'Not quite', `You need ${TEST_PASS}/${TEST_COUNT} to pass. Your mistakes went to the review pile.`])
    : run.practice ? ['🎯', 'Practice stopped', `You reached level ${practiceLevel() + 1}.`]
    : ['🎉', 'Lesson complete!', 'A new entry was added to your Notes.'];
  const streakNow = shownStreak(), goal = state.settings.goal, todayXp = state.days[today()] || 0;
  const earned = passed ? run.xp : 0, xpBefore = Math.max(0, todayXp - earned);
  if (passed && run.id) ui.justDone = run.id;
  app.innerHTML = `<div class="card finish stagger">
    <div class="big">${icon}</div><h2>${head}</h2><div>${sub}</div>
    <div class="stats3">
      <div><b class="bump" id="xpWon">+${earned}</b><small>XP earned</small></div>
      <div><b>${acc}%</b><small>accuracy (${right}/${answered})</small></div>
      <div><b class="${streakNow > streakBefore ? 'bump' : ''}">🔥 ${streakNow}</b><small>${streakNow > streakBefore ? 'streak up!' : 'day streak'}</small></div>
    </div>
    <div class="goalbar"><small>Daily goal: ${Math.min(todayXp, goal)} / ${goal} XP ${todayXp >= goal ? '✓' : ''}</small><div class="mini"><div id="goalFill" style="width:${Math.min(100, (calm.matches ? todayXp : xpBefore) / goal * 100)}%"></div></div></div>
    <button class="primary" id="go">${run.back === 'notes' ? 'Back to notes' : 'Back to path'}</button></div>`;
  if (passed && run.xp) beep(true);
  if (passed && (!run.daily || run.correct) && !run.practice && !run.review) setTimeout(confetti, 200);
  countUp(document.getElementById('xpWon'), earned, '+');
  const gf = document.getElementById('goalFill'); setTimeout(() => { gf.style.width = Math.min(100, todayXp / goal * 100) + '%'; }, 450);
  const go = document.getElementById('go'); go.focus();
  const back = run.back || 'learn'; go.onclick = () => show(back);
}

// Enter key = Check / Continue (desktop).
// 1-9 = pick a multiple-choice answer, H = hint (not while typing in a box).
document.addEventListener('keydown', e => {
  if (!run || app.dataset.out) return;
  if (e.key === 'Enter') { const g = document.getElementById('go'); if (g) { e.preventDefault(); g.click(); } return; }
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const ch = app.querySelectorAll('.choice');
  if (/^[1-9]$/.test(e.key) && ch[e.key - 1]) { ch[e.key - 1].click(); return; }
  if (e.key.toLowerCase() === 'h') { const hb = document.getElementById('hintBtn'); if (hb) hb.click(); }
});

// Reset with an in-page confirm (browser confirm() dialogs are blocked in some viewers).
const resetBtn = document.getElementById('reset'), resetMsg = document.getElementById('resetMsg');
let armed = false;
resetBtn.onclick = () => {
  if (!armed) { armed = true; resetBtn.textContent = 'Click again to wipe all progress'; return; }
  state = Object.assign(state, freshProgress(), { resetAt: Date.now() }); ui.entry = null; save(); armed = false;
  resetBtn.textContent = 'Reset progress'; resetMsg.textContent = 'Progress wiped.'; show('learn');
};

if (!state.profile.joined) { state.profile.joined = Date.now(); save(); }
applyTheme();
show('learn', 'fade');
cloud.start();
</script>
